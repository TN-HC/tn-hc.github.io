<div class="ft-full">
  <div class="ft-note">
    <p>
      {{ site.Params.footer_note }}
    </p>
  </div>
</div>
<footer class="footer">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <div class="footer-menu">
          <ul>
            {{ range site.Menus.footer }}
            <li><a href="{{ .URL | relLangURL }}">{{ .Name }}</a></li>
            {{ end }}
          </ul>
        </div>
      </div>
      <div class="footer-logo">
        <a href="https://iaopc.com">
          <img src="/{{ site.Params.footer_image }}">
        </a>
      </div>
      <p class="copyright">Serving all of Tennessee and surrounding states.</p>
      <p class="copyright">Copyright &copy; 2022-{{ now.Year }} {{ site.Params.copyright | markdownify }}</p>
    </div>
  </div>
</footer>

<div class="sticky-call" data-sticky-call>
  <button type="button" class="sticky-call-text" data-sticky-call-open aria-expanded="false" aria-controls="sticky-call-sheet">
    Call or Text
  </button>
  <div class="sticky-call-backdrop" data-sticky-call-close hidden></div>
  <div id="sticky-call-sheet" class="sticky-call-sheet" role="dialog" aria-label="Call or text Tennessee Horse Cremation" hidden>
    <p class="sticky-call-sheet-title">How would you like to reach us?</p>
    <a class="sticky-call-action" href="tel:+19313002333">Call 931-300-2333</a>
    <a class="sticky-call-action sticky-call-action--secondary" href="sms:+19313002333">Text 931-300-2333</a>
    <button type="button" class="sticky-call-cancel" data-sticky-call-close>Cancel</button>
  </div>
</div>

<script>
(function () {
  var root = document.querySelector("[data-sticky-call]");
  if (!root) return;
  var openBtn = root.querySelector("[data-sticky-call-open]");
  var sheet = root.querySelector("#sticky-call-sheet");
  var backdrop = root.querySelector(".sticky-call-backdrop");
  var closers = root.querySelectorAll("[data-sticky-call-close]");

  function setOpen(isOpen) {
    openBtn.setAttribute("aria-expanded", isOpen ? "true" : "false");
    sheet.hidden = !isOpen;
    backdrop.hidden = !isOpen;
    root.classList.toggle("is-open", isOpen);
  }

  openBtn.addEventListener("click", function () {
    setOpen(sheet.hidden);
  });
  closers.forEach(function (el) {
    el.addEventListener("click", function () {
      setOpen(false);
    });
  });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") setOpen(false);
  });
})();
</script>
